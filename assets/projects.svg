<svg xmlns="http://www.w3.org/2000/svg" width="840" height="602" viewBox="0 0 840 602" role="img" aria-label="Academic projects">
<title>Academic projects</title>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;fill:#eef2f7}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}
.muted{fill:#9aa7b8}
.mint{fill:#5eead4}
.h{font-size:32px;font-weight:700}
.eyebrow{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace;font-size:15px;fill:#5eead4;letter-spacing:1.5px}
@keyframes rise{from{opacity:0;transform:translateY(14px)}}
.rise{animation:rise .7s cubic-bezier(.2,.7,.2,1) both}
@keyframes pulse{from{stroke-dashoffset:200}to{stroke-dashoffset:0}}
.pulse{fill:none;stroke-width:3;stroke-linecap:round;stroke-dasharray:10 190;animation:pulse 3s linear infinite}
@keyframes blink{50%{opacity:0}}
.blink{animation:blink 1.1s steps(1) infinite}
@keyframes spot{0%,22%,100%{opacity:.2}10%{opacity:1}}
.spot{opacity:.2;animation:spot 12s ease-in-out infinite}
@keyframes drift{50%{transform:translate(36px,-22px)}}
.drift{animation:drift 11s ease-in-out infinite}
@keyframes march{to{stroke-dashoffset:-48}}
.march{animation:march 4s linear infinite}
@keyframes shine{0%{transform:translateX(-340px)}55%,100%{transform:translateX(1020px)}}
.shine{animation:shine 7s ease-in-out infinite}
@keyframes fill{0%{transform:scaleX(0)}22%,100%{transform:scaleX(1)}}
.fill{transform-box:fill-box;transform-origin:left;animation:fill 9s cubic-bezier(.2,.7,.2,1) infinite}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<defs><linearGradient id="brand" x1="0" x2="1"><stop offset="0" stop-color="#5eead4"/><stop offset="1" stop-color="#a78bfa"/></linearGradient>
<linearGradient id="sheen" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".09"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient><clipPath id="frame"><rect width="840" height="602" rx="18"/></clipPath></defs>
<g clip-path="url(#frame)">
<rect width="840" height="602" fill="#0b0f14"/><rect x=".5" y=".5" width="839" height="601" rx="17.5" fill="none" stroke="#2a3442"/><text class="eyebrow rise" x="40" y="50">PROJECTS</text><text class="h rise" x="40" y="92" style="animation-delay:.08s">Academic projects</text><g class="rise" style="animation-delay:0.15s">
<rect x="40" y="122" width="760" height="98" rx="14" fill="#121922" stroke="#2a3442"/>
<rect class="spot" x="40" y="136" width="4" height="70" rx="2" fill="url(#brand)" style="animation-delay:0.0s"/>
<text class="mono mint" x="66" y="162" font-size="17">01</text>
<text x="106" y="162" font-size="23" font-weight="700">Computer Shop Management System</text>
<text class="muted" x="106" y="194" font-size="18">Products, payments, shipping, returns. React, NestJS, MySQL.</text>
</g><g class="rise" style="animation-delay:0.25s">
<rect x="40" y="232" width="760" height="124" rx="14" fill="#121922" stroke="#2a3442"/>
<rect class="spot" x="40" y="246" width="4" height="96" rx="2" fill="url(#brand)" style="animation-delay:2.4s"/>
<text class="mono mint" x="66" y="272" font-size="17">02</text>
<text x="106" y="272" font-size="23" font-weight="700">Hotel Cancellation Forecasting</text>
<text class="muted" x="106" y="304" font-size="18">Random Forest model in Python that predicts cancellations.</text><rect x="106" y="322" width="480" height="10" rx="5" fill="#2a3442"/><rect class="fill" x="106" y="322" width="381" height="10" rx="5" fill="url(#brand)"/><text class="mono mint" x="604" y="333" font-size="17">recall 0.794</text>
</g><g class="rise" style="animation-delay:0.35s">
<rect x="40" y="368" width="760" height="98" rx="14" fill="#121922" stroke="#2a3442"/>
<rect class="spot" x="40" y="382" width="4" height="70" rx="2" fill="url(#brand)" style="animation-delay:4.8s"/>
<text class="mono mint" x="66" y="408" font-size="17">03</text>
<text x="106" y="408" font-size="23" font-weight="700">In-Game Top-Up App</text>
<text class="muted" x="106" y="440" font-size="18">Android app with orders and alerts. C#, Xamarin, Firebase.</text>
</g><g class="rise" style="animation-delay:0.45s">
<rect x="40" y="478" width="760" height="98" rx="14" fill="#121922" stroke="#2a3442"/>
<rect class="spot" x="40" y="492" width="4" height="70" rx="2" fill="url(#brand)" style="animation-delay:7.2s"/>
<text class="mono mint" x="66" y="518" font-size="17">04</text>
<text x="106" y="518" font-size="23" font-weight="700">Clinic Information System</text>
<text class="muted" x="106" y="550" font-size="18">Staff, inventory, scheduling, billing. PHP, SQL.</text>
</g><rect class="shine" x="0" y="0" width="300" height="602" fill="url(#sheen)"/>
</g>
</svg>
