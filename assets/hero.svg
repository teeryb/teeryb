<svg xmlns="http://www.w3.org/2000/svg" width="840" height="400" viewBox="0 0 840 400" role="img" aria-label="Software Engineer (Full Stack &amp; AI)">
<title>Software Engineer (Full Stack &amp; AI)</title>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;fill:#eef2f7}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}
.muted{fill:#9aa7b8}
.mint{fill:#5eead4}
.h{font-size:32px;font-weight:700}
.eyebrow{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace;font-size:15px;fill:#5eead4;letter-spacing:1.5px}
@keyframes rise{from{opacity:0;transform:translateY(14px)}}
.rise{animation:rise .7s cubic-bezier(.2,.7,.2,1) both}
@keyframes pulse{from{stroke-dashoffset:200}to{stroke-dashoffset:0}}
.pulse{fill:none;stroke-width:3;stroke-linecap:round;stroke-dasharray:10 190;animation:pulse 3s linear infinite}
@keyframes blink{50%{opacity:0}}
.blink{animation:blink 1.1s steps(1) infinite}
@keyframes spot{0%,22%,100%{opacity:.2}10%{opacity:1}}
.spot{opacity:.2;animation:spot 12s ease-in-out infinite}
@keyframes drift{50%{transform:translate(36px,-22px)}}
.drift{animation:drift 11s ease-in-out infinite}
@keyframes march{to{stroke-dashoffset:-48}}
.march{animation:march 4s linear infinite}
@keyframes shine{0%{transform:translateX(-340px)}55%,100%{transform:translateX(1020px)}}
.shine{animation:shine 7s ease-in-out infinite}
@keyframes fill{0%{transform:scaleX(0)}22%,100%{transform:scaleX(1)}}
.fill{transform-box:fill-box;transform-origin:left;animation:fill 9s cubic-bezier(.2,.7,.2,1) infinite}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<defs><linearGradient id="brand" x1="0" x2="1"><stop offset="0" stop-color="#5eead4"/><stop offset="1" stop-color="#a78bfa"/></linearGradient>
<linearGradient id="sheen" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".09"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient><clipPath id="frame"><rect width="840" height="400" rx="18"/></clipPath><filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="55"/></filter>
<pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.2" fill="#fff" opacity=".07"/></pattern>
<clipPath id="reveal"><rect x="30" y="130" height="150" width="430"><animate attributeName="width" from="0" to="430" dur="1.3s" begin=".25s" fill="freeze" calcMode="spline" keySplines=".3 .1 .2 1" keyTimes="0;1"/></rect></clipPath></defs>
<g clip-path="url(#frame)">
<rect width="840" height="400" fill="#0b0f14"/><rect x=".5" y=".5" width="839" height="399" rx="17.5" fill="none" stroke="#2a3442"/>
<circle class="drift" cx="130" cy="330" r="130" fill="#a78bfa" opacity=".3" filter="url(#blur)"/>
<circle class="drift" cx="640" cy="90" r="120" fill="#5eead4" opacity=".2" filter="url(#blur)" style="animation-delay:-5s"/>
<rect width="840" height="400" fill="url(#dots)"/>
<rect width="840" height="44" fill="#121922"/><path d="M0 44.5H840" stroke="#2a3442"/>
<circle cx="24" cy="22" r="6" fill="#fb7185"/><circle cx="44" cy="22" r="6" fill="#fbbf24"/><circle cx="64" cy="22" r="6" fill="#5eead4"/>
<rect x="250" y="10" width="340" height="24" rx="12" fill="#0b0f14"/>
<text class="mono muted" x="420" y="27" text-anchor="middle" font-size="14">github.com/teeryb</text>
<text class="eyebrow rise" x="40" y="110">FULL STACK &amp; AI</text>
<g clip-path="url(#reveal)"><text x="38" y="190" font-size="62" font-weight="800">Software</text>
<text x="38" y="256" font-size="62" font-weight="800" fill="url(#brand)" style="fill:url(#brand)">Engineer</text></g>
<text class="rise" x="40" y="312" font-size="21" style="animation-delay:1.2s">I build web apps and AI agents,</text>
<text class="rise muted" x="40" y="342" font-size="21" style="animation-delay:1.35s">from architecture to production.<tspan class="blink mint"> ▌</tspan></text>
<path d="M568 150 C592 150 576 225 596 225" fill="none" stroke="#2a3442" stroke-width="2"/><path d="M568 225 C592 225 576 225 596 225" fill="none" stroke="#2a3442" stroke-width="2"/><path d="M568 300 C592 300 576 225 596 225" fill="none" stroke="#2a3442" stroke-width="2"/><path d="M684 225 C704 225 688 150 712 150" fill="none" stroke="#2a3442" stroke-width="2"/><path d="M684 225 C704 225 688 225 712 225" fill="none" stroke="#2a3442" stroke-width="2"/><path d="M684 225 C704 225 688 300 712 300" fill="none" stroke="#2a3442" stroke-width="2"/><path class="pulse" d="M568 150 C592 150 576 225 596 225" pathLength="100" stroke="#5eead4" style="animation-delay:0.0s"/><path class="pulse" d="M568 225 C592 225 576 225 596 225" pathLength="100" stroke="#5eead4" style="animation-delay:0.5s"/><path class="pulse" d="M568 300 C592 300 576 225 596 225" pathLength="100" stroke="#5eead4" style="animation-delay:1.0s"/><path class="pulse" d="M684 225 C704 225 688 150 712 150" pathLength="100" stroke="#a78bfa" style="animation-delay:0.9s"/><path class="pulse" d="M684 225 C704 225 688 225 712 225" pathLength="100" stroke="#a78bfa" style="animation-delay:1.4s"/><path class="pulse" d="M684 225 C704 225 688 300 712 300" pathLength="100" stroke="#a78bfa" style="animation-delay:1.9s"/>
<rect x="596" y="189" width="88" height="72" rx="14" fill="#121922" stroke="url(#brand)" stroke-width="2"/>
<text x="640" y="234" text-anchor="middle" font-size="26" font-weight="800">MCP</text>
<rect class="march" x="586" y="179" width="108" height="92" rx="20" fill="none" stroke="#fbbf24" stroke-width="1.5" stroke-dasharray="6 6" opacity=".75"/>
<text class="mono" x="640" y="292" text-anchor="middle" font-size="13" style="fill:#fbbf24">guardrails</text>
<g class="rise" style="animation-delay:0.30s"><rect x="472" y="132" width="96" height="36" rx="18" fill="#121922" stroke="#2a3442"/><text x="520" y="155" text-anchor="middle" font-size="15" font-weight="600">OpenAI</text></g><g class="rise" style="animation-delay:0.40s"><rect x="472" y="207" width="96" height="36" rx="18" fill="#121922" stroke="#2a3442"/><text x="520" y="230" text-anchor="middle" font-size="15" font-weight="600">Anthropic</text></g><g class="rise" style="animation-delay:0.50s"><rect x="472" y="282" width="96" height="36" rx="18" fill="#121922" stroke="#2a3442"/><text x="520" y="305" text-anchor="middle" font-size="15" font-weight="600">Ollama</text></g><g class="rise" style="animation-delay:0.60s"><rect x="712" y="132" width="96" height="36" rx="18" fill="#121922" stroke="#2a3442"/><text x="760" y="155" text-anchor="middle" font-size="15" font-weight="600">Databases</text></g><g class="rise" style="animation-delay:0.70s"><rect x="712" y="207" width="96" height="36" rx="18" fill="#121922" stroke="#2a3442"/><text x="760" y="230" text-anchor="middle" font-size="15" font-weight="600">APIs</text></g><g class="rise" style="animation-delay:0.80s"><rect x="712" y="282" width="96" height="36" rx="18" fill="#121922" stroke="#2a3442"/><text x="760" y="305" text-anchor="middle" font-size="15" font-weight="600">RAG</text></g>
<text class="mono muted" x="520" y="116" text-anchor="middle" font-size="13">models</text>
<text class="mono muted" x="760" y="116" text-anchor="middle" font-size="13">data</text>
</g>
</svg>
