<svg xmlns="http://www.w3.org/2000/svg" width="840" height="764" viewBox="0 0 840 764" role="img" aria-label="Tech stack">
<title>Tech stack</title>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;fill:#eef2f7}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}
.muted{fill:#9aa7b8}
.mint{fill:#5eead4}
.h{font-size:32px;font-weight:700}
.eyebrow{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace;font-size:15px;fill:#5eead4;letter-spacing:1.5px}
@keyframes rise{from{opacity:0;transform:translateY(14px)}}
.rise{animation:rise .7s cubic-bezier(.2,.7,.2,1) both}
@keyframes pulse{from{stroke-dashoffset:200}to{stroke-dashoffset:0}}
.pulse{fill:none;stroke-width:3;stroke-linecap:round;stroke-dasharray:10 190;animation:pulse 3s linear infinite}
@keyframes blink{50%{opacity:0}}
.blink{animation:blink 1.1s steps(1) infinite}
@keyframes spot{0%,22%,100%{opacity:.2}10%{opacity:1}}
.spot{opacity:.2;animation:spot 12s ease-in-out infinite}
@keyframes drift{50%{transform:translate(36px,-22px)}}
.drift{animation:drift 11s ease-in-out infinite}
@keyframes march{to{stroke-dashoffset:-48}}
.march{animation:march 4s linear infinite}
@keyframes shine{0%{transform:translateX(-340px)}55%,100%{transform:translateX(1020px)}}
.shine{animation:shine 7s ease-in-out infinite}
@keyframes fill{0%{transform:scaleX(0)}22%,100%{transform:scaleX(1)}}
.fill{transform-box:fill-box;transform-origin:left;animation:fill 9s cubic-bezier(.2,.7,.2,1) infinite}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
